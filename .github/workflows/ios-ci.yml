name: iOS CI

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "mobile/ios/**"
      - ".github/workflows/ios-ci.yml"

jobs:
  ios-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile/ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode Cloud iOS source gate
        working-directory: ${{ github.workspace }}
        run: bash mobile/ios/ci_scripts/test_ios_app_source_gate.sh

      - name: Verify Xcode Cloud release-intent and marketing-version gates
        working-directory: ${{ github.workspace }}
        run: bash mobile/ios/ci_scripts/test_ios_release_gates.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen

      - name: Verify HealthKit project wiring
        run: |
          PBX=HiAir.xcodeproj/project.pbxproj
          grep -q 'HealthKitService.swift in Sources' "$PBX"
          grep -q 'INFOPLIST_KEY_NSHealthShareUsageDescription' "$PBX"
          grep -q 'INFOPLIST_KEY_NSHealthUpdateUsageDescription' "$PBX"

      - name: Build simulator target
        run: |
          xcodebuild \
            -project HiAir.xcodeproj \
            -scheme HiAir \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Build release simulator target (no signing)
        run: |
          xcodebuild \
            -project HiAir.xcodeproj \
            -scheme HiAir \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Run iOS unit tests
        run: |
          # Prefer a concrete simulator; fall back to first available iPhone if name drifts (e.g. 16→17).
          DEST="platform=iOS Simulator,name=iPhone 17"
          if ! xcrun simctl list devices available | grep -q "iPhone 17"; then
            PHONE=$(xcrun simctl list devices available | awk -F'[()]' '/iPhone/{gsub(/^[[:space:]]+/,"",$1); print $1; exit}')
            DEST="platform=iOS Simulator,name=${PHONE}"
          fi
          echo "Using destination: ${DEST}"
          xcodebuild \
            -project HiAir.xcodeproj \
            -scheme HiAir \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "${DEST}" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:HiAirTests \
            test \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES
