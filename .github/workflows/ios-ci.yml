name: iOS CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed domain
        id: changes
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/scope.py --scope ios --base "${{ github.event.pull_request.base.sha || github.event.before }}" --head "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Verify Xcode Cloud iOS source gate
        if: steps.changes.outputs.run == 'true'
        working-directory: ${{ github.workspace }}
        run: bash mobile/ios/ci_scripts/test_ios_app_source_gate.sh

      - name: Verify Xcode Cloud release-intent and marketing-version gates
        if: steps.changes.outputs.run == 'true'
        working-directory: ${{ github.workspace }}
        run: bash mobile/ios/ci_scripts/test_ios_release_gates.sh

      - name: Install XcodeGen
        if: steps.changes.outputs.run == 'true'
        run: brew install xcodegen

      - name: Generate project
        if: steps.changes.outputs.run == 'true'
        run: xcodegen

      - name: Verify HealthKit project wiring
        if: steps.changes.outputs.run == 'true'
        run: |
          PBX=HiAir.xcodeproj/project.pbxproj
          grep -q 'HealthKitService.swift in Sources' "$PBX"
          grep -q 'INFOPLIST_KEY_NSHealthShareUsageDescription' "$PBX"
          grep -q 'INFOPLIST_KEY_NSHealthUpdateUsageDescription' "$PBX"

      - name: Build release simulator target (no signing)
        if: steps.changes.outputs.run == 'true'
        run: |
          xcodebuild \
            -project HiAir.xcodeproj \
            -scheme HiAir \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify simulator and result gate contracts
        if: steps.changes.outputs.run == 'true'
        run: python3 ../../scripts/ci/test_ios_runtime_gate.py

      - name: Prepare concrete simulator with bounded readiness
        if: steps.changes.outputs.run == 'true'
        id: simulator
        run: |
          DEST="$(python3 ../../scripts/ci/ios_runtime_gate.py prepare 2> "${RUNNER_TEMP}/hiair-simulator-boot.log")"
          echo "destination=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Run iOS unit tests
        if: steps.changes.outputs.run == 'true'
        run: |
          set -o pipefail
          xcodebuild \
            -project HiAir.xcodeproj \
            -scheme HiAir \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:HiAirTests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            -resultBundlePath "${RUNNER_TEMP}/hiair-unit.xcresult" \
            test \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES 2>&1 | tee "${RUNNER_TEMP}/hiair-unit.log"
          python3 ../../scripts/ci/ios_runtime_gate.py verify --result "${RUNNER_TEMP}/hiair-unit.xcresult"

      - name: Preserve iOS execution diagnostics
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hiair-simulator-boot.log
            ${{ runner.temp }}/hiair-unit.log
            ${{ runner.temp }}/hiair-unit.xcresult
