name: hiair-io-pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "infra/cloudflare/**"
      - "scripts/ops/generate_web_seo_content.py"
      - "scripts/ops/check_web_seo.py"
      - "scripts/ops/check_web_local_routes.py"
      - ".github/workflows/hiair-io-pages.yml"
  pull_request:
    paths:
      - "web/**"
      - "infra/cloudflare/**"
      - "scripts/ops/generate_web_seo_content.py"
      - "scripts/ops/check_web_seo.py"
      - "scripts/ops/check_web_local_routes.py"
      - ".github/workflows/hiair-io-pages.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate search content
        run: python3 scripts/ops/generate_web_seo_content.py

      - name: Fail if generator created a web diff
        run: git diff --exit-code -- web

      - name: Validate SEO integrity
        run: python3 scripts/ops/check_web_seo.py

      - name: Smoke local static routes
        run: python3 scripts/ops/check_web_local_routes.py

      - name: Syntax-check web scripts
        run: |
          python3 -m py_compile scripts/ops/generate_web_seo_content.py scripts/ops/check_web_seo.py scripts/ops/check_web_local_routes.py
          node --check web/js/main.js
          node --test web/js/growth-telemetry.test.cjs

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate and validate search content
        run: |
          python3 scripts/ops/generate_web_seo_content.py
          git diff --exit-code -- web
          python3 scripts/ops/check_web_seo.py

      - name: Inject Growth OS events URL
        env:
          GROWTH_OS_EVENTS_URL: ${{ secrets.GROWTH_OS_EVENTS_URL }}
        run: |
          if [ -n "${GROWTH_OS_EVENTS_URL:-}" ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          url = os.environ["GROWTH_OS_EVENTS_URL"]
          path = Path("web/js/main.js")
          text = path.read_text(encoding="utf-8")
          path.write_text(text.replace("__GROWTH_OS_EVENTS_URL__", url), encoding="utf-8")
          PY
          else
            echo "GROWTH_OS_EVENTS_URL unset; production telemetry remains no-op."
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set; skipping Pages deploy."
            exit 0
          fi
          cd web
          npx --yes wrangler@4 pages deploy . \
            --project-name=hiair-web \
            --branch=production \
            --commit-dirty=true

      - name: Deploy Worker domain proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "Skipping Worker deploy; use ./scripts/ops/connect_hiair_io.sh deploy-web locally with wrangler login."
            exit 0
          fi
          cd infra/cloudflare/hiair-io-proxy
          npx --yes wrangler@4 deploy
