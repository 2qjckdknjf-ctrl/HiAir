name: hiair-io-pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "infra/cloudflare/**"
      - ".github/workflows/hiair-io-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate and validate search content
        run: |
          python3 scripts/ops/generate_web_seo_content.py
          python3 scripts/ops/check_web_seo.py

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set; skipping Pages deploy."
            exit 0
          fi
          cd web
          npx --yes wrangler@4 pages deploy . \
            --project-name=hiair-web \
            --branch=production \
            --commit-dirty=true

      - name: Deploy Worker domain proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "Skipping Worker deploy; use ./scripts/ops/connect_hiair_io.sh deploy-web locally with wrangler login."
            exit 0
          fi
          cd infra/cloudflare/hiair-io-proxy
          npx --yes wrangler@4 deploy
