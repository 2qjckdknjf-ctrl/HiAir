name: Android Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: Release status in Play Console
        required: true
        default: completed
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted
      version_name:
        description: Android versionName (defaults to RELEASE_TRAIN.json)
        required: false
        type: string
        default: ""
      version_code:
        description: Android versionCode (defaults to max(release train, run_number))
        required: false
        type: string
      changes_not_sent_for_review:
        description: Leave changes for manual review only when required by Play Console
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "android/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      version_code: ${{ steps.release_meta.outputs.version_code }}
      version_name: ${{ steps.release_meta.outputs.version_name }}
      track: ${{ steps.release_meta.outputs.track }}
      status: ${{ steps.release_meta.outputs.status }}
      publish_ready: ${{ steps.release_gate.outputs.publish_ready }}
    defaults:
      run:
        working-directory: mobile/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify main and production source
        working-directory: .
        run: python3 scripts/release/check_mobile_release_source.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Validate release secrets
        id: release_gate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing_signing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing_signing+=("$name")
            fi
          done
          if [ "${#missing_signing[@]}" -gt 0 ]; then
            echo "signing_ready=false" >> "$GITHUB_OUTPUT"
            echo "Missing signing secrets: ${missing_signing[*]}"
            echo "Build will continue unsigned."
          else
            echo "signing_ready=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present."
          fi
          if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "publish_ready=false" >> "$GITHUB_OUTPUT"
            echo "Missing production secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            echo "Play upload will be skipped until the service account JSON is set."
          elif [ "${#missing_signing[@]}" -gt 0 ]; then
            echo "publish_ready=false" >> "$GITHUB_OUTPUT"
            echo "Play upload requires all release signing secrets."
          else
            echo "publish_ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode upload keystore
        if: steps.release_gate.outputs.signing_ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Resolve release metadata
        id: release_meta
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_STATUS: ${{ inputs.status }}
        run: |
          python3 <<'PY'
          import json, os, re
          from pathlib import Path
          train = json.loads(Path('../../docs/release/RELEASE_TRAIN.json').read_text())
          name = os.getenv('INPUT_VERSION_NAME') or train['android_version_name']
          code = int(os.getenv('INPUT_VERSION_CODE') or max(train['android_version_code'], int(os.environ['GITHUB_RUN_NUMBER'])))
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.+_-]{0,49}', name) or not 1 <= code <= 2100000000:
              raise SystemExit('Invalid release version')
          metadata = {'version_name': name, 'version_code': code,
              'track': os.getenv('INPUT_TRACK') or 'internal',
              'status': os.getenv('INPUT_STATUS') or 'completed'}
          if metadata['track'] not in ('internal', 'alpha', 'beta', 'production') or metadata['status'] not in ('completed', 'draft', 'inProgress', 'halted'):
              raise SystemExit('Invalid release track/status')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in metadata.items():
                  output.write(f'{key}={value}\n')
          PY

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.release_meta.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.release_meta.outputs.version_name }}
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Validate production API in AAB
        working-directory: .
        run: bash scripts/release/validate_store_release_builds.sh android

      - name: Upload to Google Play
        id: play_upload
        if: steps.release_gate.outputs.publish_ready == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hiair
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.release_meta.outputs.track }}
          status: ${{ steps.release_meta.outputs.status }}
          releaseName: HiAir ${{ steps.release_meta.outputs.version_name }} (${{ steps.release_meta.outputs.version_code }})
          changesNotSentForReview: ${{ github.event.inputs.changes_not_sent_for_review == 'true' }}

      - name: Record artifact provenance
        if: always()
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version_name }}
          RELEASE_CODE: ${{ steps.release_meta.outputs.version_code }}
          RELEASE_TRACK: ${{ steps.release_meta.outputs.track }}
          SIGNING_READY: ${{ steps.release_gate.outputs.signing_ready }}
          PLAY_UPLOAD_OUTCOME: ${{ steps.play_upload.outcome }}
        run: |
          python3 <<'PY'
          import hashlib, json, os
          from pathlib import Path
          bundle = Path('app/build/outputs/bundle/release/app-release.aab')
          if bundle.exists():
              receipt = {key: os.getenv(key, '') for key in (
                  'GITHUB_SHA', 'GITHUB_RUN_ID', 'RELEASE_VERSION', 'RELEASE_CODE',
                  'RELEASE_TRACK', 'SIGNING_READY', 'PLAY_UPLOAD_OUTCOME')}
              receipt['sha256'] = hashlib.sha256(bundle.read_bytes()).hexdigest()
              bundle.with_name('release-manifest.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hiair-android-${{ steps.release_meta.outputs.version_name }}
          path: mobile/android/app/build/outputs/bundle/release/
          retention-days: 30
