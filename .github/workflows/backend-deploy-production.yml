name: Backend Deploy Production

# Release-preflight (pytest + clean DB init) must pass before any production deploy.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Immutable release SHA to deploy (defaults to selected ref HEAD)"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "infra/cloudflare/hiair-api/**"
      - "scripts/release/deploy_backend.sh"
      - "scripts/release/post_deploy_api_smoke.py"
      - "scripts/ops/deploy_hiair_api_cloudflare.sh"
      - ".github/workflows/backend-deploy-production.yml"

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  statuses: read
  checks: read

jobs:
  resolve-release-sha:
    runs-on: ubuntu-latest
    outputs:
      resolved_release_sha: ${{ steps.resolve.outputs.resolved_release_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve immutable production deploy SHA
        id: resolve
        run: |
          set -euo pipefail
          RESOLVED="$(python3 scripts/release/resolve_production_deploy_sha.py \
            --event-name "${GITHUB_EVENT_NAME}" \
            --github-ref "${GITHUB_REF}" \
            --github-sha "${GITHUB_SHA}" \
            --input-sha "${{ inputs.release_sha }}")"
          echo "resolved_release_sha=${RESOLVED}" >> "${GITHUB_OUTPUT}"

  release-preflight:
    needs: resolve-release-sha
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hiair
          POSTGRES_USER: hiair
          POSTGRES_PASSWORD: hiair
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hiair -d hiair"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://hiair:hiair@localhost:5432/hiair
      JWT_SECRET: ci-test-jwt-secret-32-bytes-min-abcdef
      NOTIFICATION_ADMIN_TOKEN: ci-admin-token-123456
      SUBSCRIPTION_PROVIDER: stub
      SUBSCRIPTION_WEBHOOK_SECRET: ci-webhook-secret-123456
      HIAIR_SMOKE_LEGACY_AUTH: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout deploy SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release-sha.outputs.resolved_release_sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend quality gate
        working-directory: backend
        run: python scripts/run_backend_gate.py --skip-smoke

      - name: Verify clean database initialization
        working-directory: backend
        run: |
          python scripts/init_db.py
          python scripts/retention_cleanup.py --dry-run
          python scripts/smoke_db_flow.py

  deploy-production:
    runs-on: ubuntu-latest
    needs:
      - resolve-release-sha
      - release-preflight
    environment: production
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NOTIFICATION_ADMIN_TOKEN: ${{ secrets.NOTIFICATION_ADMIN_TOKEN }}
      SUBSCRIPTION_PROVIDER: ${{ secrets.SUBSCRIPTION_PROVIDER }}
      SUBSCRIPTION_WEBHOOK_SECRET: ${{ secrets.SUBSCRIPTION_WEBHOOK_SECRET }}
      HIAIR_AUTH_PROVIDER: ${{ secrets.HIAIR_AUTH_PROVIDER }}
      APPLE_STORE_VERIFIER_MODE: ${{ secrets.APPLE_STORE_VERIFIER_MODE }}
      APPLE_STORE_ENVIRONMENT: ${{ secrets.APPLE_STORE_ENVIRONMENT }}
      APPLE_APP_APPLE_ID: ${{ secrets.APPLE_APP_APPLE_ID }}
      APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SIGN_IN_KEY_ID: ${{ secrets.APPLE_SIGN_IN_KEY_ID }}
      APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
      APPLE_SIGN_IN_P8_CONTENT: ${{ secrets.APPLE_SIGN_IN_P8_CONTENT }}
      GOOGLE_PLAY_VERIFIER_MODE: ${{ secrets.GOOGLE_PLAY_VERIFIER_MODE }}
      GOOGLE_PLAY_PACKAGE_NAME: ${{ secrets.GOOGLE_PLAY_PACKAGE_NAME }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      ENVIRONMENT_ALLOW_SAMPLE_FALLBACK: "false"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_PROMPT_VERSION: ${{ secrets.OPENAI_PROMPT_VERSION }}
      OPENAI_RATE_LIMIT_PER_MINUTE: "60"
      OPENAI_HTTP_TIMEOUT_SECONDS: "8"
      OPENAI_MAX_TOKENS: "120"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WEATHER_API_PROVIDER: ${{ secrets.WEATHER_API_PROVIDER }}
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
      AQI_API_PROVIDER: ${{ secrets.AQI_API_PROVIDER }}
      AQI_API_KEY: ${{ secrets.AQI_API_KEY }}
      NOTIFICATIONS_PROVIDER_MODE: ${{ secrets.NOTIFICATIONS_PROVIDER_MODE }}
      HIAIR_ROLLBACK_COMMAND: ${{ secrets.HIAIR_ROLLBACK_COMMAND }}
      RETENTION_NOTIFICATION_DELIVERY_ATTEMPTS_DAYS: "90"
      RETENTION_NOTIFICATION_EVENTS_DAYS: "180"
      RETENTION_SUBSCRIPTION_WEBHOOK_EVENTS_DAYS: "180"
      RETENTION_SECRET_ROTATION_EVENTS_DAYS: "365"
    steps:
      - name: Checkout deploy SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release-sha.outputs.resolved_release_sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-deploy gate
        working-directory: backend
        run: |
          python -m compileall app scripts
          python scripts/check_env_security.py --strict
          python scripts/validate_risk_historical.py

      - name: Deploy to production (DB smoke + AI gate)
        run: |
          bash scripts/release/deploy_backend.sh production

      - name: Detect Cloudflare deploy credentials
        id: cloudflare
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN}" && -n "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "enabled=1" >> "${GITHUB_OUTPUT}"
          else
            echo "Cloudflare credentials missing; skipping container deploy."
            echo "enabled=0" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Docker Buildx
        if: steps.cloudflare.outputs.enabled == '1'
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        if: steps.cloudflare.outputs.enabled == '1'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Write Cloudflare deploy env file
        if: steps.cloudflare.outputs.enabled == '1'
        env:
          RESOLVED_RELEASE_SHA: ${{ needs.resolve-release-sha.outputs.resolved_release_sha }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          allowed = {
              "APP_ENV",
              "DATABASE_URL",
              "DIRECT_DATABASE_URL",
              "JWT_SECRET",
              "JWT_ALGORITHM",
              "HIAIR_AUTH_PROVIDER",
              "HIAIR_AUTH_LEGACY_ENABLED",
              "HIAIR_IOS_URL_SCHEME",
              "HIAIR_ANDROID_URL_SCHEME",
              "HIAIR_AUTH_REDIRECT_URI",
              "HIAIR_AUTH_EMAIL_BRIDGE_ENABLED",
              "ALLOW_LEGACY_USER_HEADER_AUTH",
              "SUPABASE_URL",
              "SUPABASE_ANON_KEY",
              "SUPABASE_SERVICE_ROLE_KEY",
              "SUPABASE_JWT_SECRET",
              "OPENAI_API_KEY",
              "OPENAI_MODEL",
              "OPENAI_BASE_URL",
              "OPENAI_PROMPT_VERSION",
              "OPENAI_RATE_LIMIT_PER_MINUTE",
              "OPENAI_HTTP_TIMEOUT_SECONDS",
              "OPENAI_MAX_TOKENS",
              "NOTIFICATION_ADMIN_TOKEN",
              "NOTIFICATIONS_PROVIDER_MODE",
              "SUBSCRIPTION_PROVIDER",
              "SUBSCRIPTION_WEBHOOK_SECRET",
              "APPLE_STORE_VERIFIER_MODE",
              "GOOGLE_PLAY_VERIFIER_MODE",
              "APPLE_BUNDLE_ID",
              "APPLE_STORE_ENVIRONMENT",
              "APPLE_APP_APPLE_ID",
              "APPLE_TEAM_ID",
              "APPLE_SIGN_IN_KEY_ID",
              "APPLE_SERVICES_ID",
              "APPLE_SIGN_IN_P8_CONTENT",
              "GOOGLE_PLAY_PACKAGE_NAME",
              "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON",
              "ENVIRONMENT_ALLOW_SAMPLE_FALLBACK",
              "DEPLOY_GIT_SHA",
              "WEATHER_API_PROVIDER",
              "WEATHER_API_KEY",
              "AQI_API_PROVIDER",
              "AQI_API_KEY",
          }
          defaults = {
              "APP_ENV": "production",
              "APPLE_BUNDLE_ID": "com.hiair.app",
              "GOOGLE_PLAY_PACKAGE_NAME": "com.hiair",
              "HIAIR_AUTH_PROVIDER": "supabase",
              "HIAIR_AUTH_EMAIL_BRIDGE_ENABLED": "true",
              "ENVIRONMENT_ALLOW_SAMPLE_FALLBACK": "false",
              "APPLE_SERVICES_ID": "com.hiair.app.auth",
          }
          out = Path("/tmp/hiair-api-secrets.env")
          lines = []
          for key in sorted(allowed):
              value = os.environ.get(key, "").strip()
              if not value and key in defaults:
                  value = defaults[key]
              if value:
                  lines.append(f"{key}={value}")
          deploy_sha = (os.environ.get("RESOLVED_RELEASE_SHA", "") or "").strip()
          if deploy_sha:
              lines.append(f"DEPLOY_GIT_SHA={deploy_sha}")
          env_map = dict(line.split("=", 1) for line in lines)
          apple_mode = env_map.get("APPLE_STORE_VERIFIER_MODE", "").strip().lower()
          apple_store_env = env_map.get("APPLE_STORE_ENVIRONMENT", "").strip().lower()
          apple_app_id = env_map.get("APPLE_APP_APPLE_ID", "").strip()
          google_mode = env_map.get("GOOGLE_PLAY_VERIFIER_MODE", "").strip().lower()
          google_sa = env_map.get("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON", "").strip()
          auth_provider = env_map.get("HIAIR_AUTH_PROVIDER", "").strip().lower()
          subscription_provider = env_map.get("SUBSCRIPTION_PROVIDER", "").strip().lower()
          if apple_mode != "live":
              raise SystemExit("ERROR: production deploy requires APPLE_STORE_VERIFIER_MODE=live")
          if apple_store_env not in ("production", "prod"):
              raise SystemExit("ERROR: production deploy requires APPLE_STORE_ENVIRONMENT=production")
          if not apple_app_id.isdigit():
              raise SystemExit("ERROR: production deploy requires numeric APPLE_APP_APPLE_ID")
          if google_mode not in ("live", "disabled"):
              raise SystemExit(
                  "ERROR: production deploy requires GOOGLE_PLAY_VERIFIER_MODE=live or disabled"
              )
          if google_mode == "live" and not google_sa:
              raise SystemExit(
                  "ERROR: production deploy requires GOOGLE_PLAY_SERVICE_ACCOUNT_JSON "
                  "when GOOGLE_PLAY_VERIFIER_MODE=live"
              )
          if auth_provider and auth_provider != "supabase":
              raise SystemExit("ERROR: production deploy requires HIAIR_AUTH_PROVIDER=supabase")
          if not auth_provider:
              env_map["HIAIR_AUTH_PROVIDER"] = "supabase"
          if not subscription_provider or subscription_provider == "stub":
              raise SystemExit("ERROR: production deploy requires SUBSCRIPTION_PROVIDER != stub")
          env_map["ENVIRONMENT_ALLOW_SAMPLE_FALLBACK"] = "false"
          lines = [f"{key}={env_map[key]}" for key in sorted(env_map)]
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Wrote {len(lines)} secrets to {out} (values not logged)")
          print("Synced keys: " + ", ".join(sorted(env_map)))
          if len(lines) < 12:
              raise SystemExit(
                  f"ERROR: expected >=12 Cloudflare secrets, got {len(lines)} "
                  "(check indentation of secrets writer loop)"
              )
          if not any(line.startswith("DEPLOY_GIT_SHA=") for line in lines):
              raise SystemExit("ERROR: DEPLOY_GIT_SHA missing from Cloudflare secrets file")
          if not any(line.startswith("DATABASE_URL=") for line in lines):
              raise SystemExit("ERROR: DATABASE_URL missing from Cloudflare secrets file")
          PY

      - name: Verify Cloudflare deploy token
        if: steps.cloudflare.outputs.enabled == '1'
        run: python3 scripts/ops/verify_cloudflare_deploy_token.py

      - name: Deploy API to Cloudflare Containers
        if: steps.cloudflare.outputs.enabled == '1'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Cloudflare deploy attempt ${attempt}/3"
            if HIAIR_API_ENV_FILE=/tmp/hiair-api-secrets.env ./scripts/ops/deploy_hiair_api_cloudflare.sh; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              echo "Cloudflare deploy failed; retrying in 45s..."
              sleep 45
            fi
          done
          echo "Cloudflare deploy failed after 3 attempts"
          exit 1

      - name: Run custom deploy command
        if: env.HIAIR_DEPLOY_COMMAND != '' && steps.cloudflare.outputs.enabled != '1'
        env:
          HIAIR_DEPLOY_COMMAND: ${{ secrets.HIAIR_DEPLOY_COMMAND }}
        run: bash -lc "${HIAIR_DEPLOY_COMMAND}"

      - name: Post-deploy API smoke
        if: steps.cloudflare.outputs.enabled == '1'
        env:
          RESOLVED_RELEASE_SHA: ${{ needs.resolve-release-sha.outputs.resolved_release_sha }}
        run: |
          python3 scripts/release/post_deploy_api_smoke.py --require-live-ai --expect-sha "${RESOLVED_RELEASE_SHA}"
          python3 scripts/release/smoke_feature_surfaces_prod.py
