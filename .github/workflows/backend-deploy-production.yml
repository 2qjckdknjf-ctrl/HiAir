name: Backend Deploy Production

# Manual production verification + optional HIAIR_DEPLOY_COMMAND hook.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend-deploy-production.yml"

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NOTIFICATION_ADMIN_TOKEN: ${{ secrets.NOTIFICATION_ADMIN_TOKEN }}
      SUBSCRIPTION_PROVIDER: ${{ secrets.SUBSCRIPTION_PROVIDER }}
      SUBSCRIPTION_WEBHOOK_SECRET: ${{ secrets.SUBSCRIPTION_WEBHOOK_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      HIAIR_DEPLOY_COMMAND: ${{ secrets.HIAIR_DEPLOY_COMMAND }}
      HIAIR_ROLLBACK_COMMAND: ${{ secrets.HIAIR_ROLLBACK_COMMAND }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-deploy gate
        working-directory: backend
        run: |
          python scripts/run_backend_gate.py --skip-smoke

      - name: Deploy to production
        run: |
          bash scripts/release/deploy_backend.sh production
