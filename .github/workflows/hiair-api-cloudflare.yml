name: hiair-api-cloudflare

on:
  push:
    branches: [main]
    paths:
      - "infra/cloudflare/hiair-api/**"
      - "backend/Dockerfile"
      - ".github/workflows/hiair-api-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WEATHER_API_PROVIDER: ${{ secrets.WEATHER_API_PROVIDER }}
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
      AQI_API_PROVIDER: ${{ secrets.AQI_API_PROVIDER }}
      AQI_API_KEY: ${{ secrets.AQI_API_KEY }}
      NOTIFICATIONS_PROVIDER_MODE: ${{ secrets.NOTIFICATIONS_PROVIDER_MODE }}
      SUBSCRIPTION_PROVIDER: ${{ secrets.SUBSCRIPTION_PROVIDER }}
      SUBSCRIPTION_WEBHOOK_SECRET: ${{ secrets.SUBSCRIPTION_WEBHOOK_SECRET }}
      HIAIR_AUTH_PROVIDER: ${{ secrets.HIAIR_AUTH_PROVIDER }}
      APPLE_STORE_VERIFIER_MODE: ${{ secrets.APPLE_STORE_VERIFIER_MODE }}
      APPLE_STORE_ENVIRONMENT: ${{ secrets.APPLE_STORE_ENVIRONMENT }}
      APPLE_APP_APPLE_ID: ${{ secrets.APPLE_APP_APPLE_ID }}
      APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
      GOOGLE_PLAY_VERIFIER_MODE: ${{ secrets.GOOGLE_PLAY_VERIFIER_MODE }}
      GOOGLE_PLAY_PACKAGE_NAME: ${{ secrets.GOOGLE_PLAY_PACKAGE_NAME }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      ENVIRONMENT_ALLOW_SAMPLE_FALLBACK: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip when Cloudflare credentials are missing
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set; skipping API deploy."
            exit 0
          fi
          if [[ -z "${DATABASE_URL}" || -z "${JWT_SECRET}" ]]; then
            echo "DATABASE_URL or JWT_SECRET not set; skipping API deploy."
            exit 0
          fi
          echo "DEPLOY=1" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        if: env.DEPLOY == '1'
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        if: env.DEPLOY == '1'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Write deploy env file
        if: env.DEPLOY == '1'
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          allowed = {
              "APP_ENV",
              "DATABASE_URL",
              "DIRECT_DATABASE_URL",
              "JWT_SECRET",
              "JWT_ALGORITHM",
              "HIAIR_AUTH_PROVIDER",
              "HIAIR_AUTH_LEGACY_ENABLED",
              "HIAIR_IOS_URL_SCHEME",
              "HIAIR_ANDROID_URL_SCHEME",
              "HIAIR_AUTH_REDIRECT_URI",
              "HIAIR_AUTH_EMAIL_BRIDGE_ENABLED",
              "ALLOW_LEGACY_USER_HEADER_AUTH",
              "SUPABASE_URL",
              "SUPABASE_ANON_KEY",
              "SUPABASE_SERVICE_ROLE_KEY",
              "SUPABASE_JWT_SECRET",
              "OPENAI_API_KEY",
              "OPENAI_MODEL",
              "OPENAI_BASE_URL",
              "OPENAI_PROMPT_VERSION",
              "OPENAI_RATE_LIMIT_PER_MINUTE",
              "OPENAI_HTTP_TIMEOUT_SECONDS",
              "OPENAI_MAX_TOKENS",
              "NOTIFICATION_ADMIN_TOKEN",
              "NOTIFICATIONS_PROVIDER_MODE",
              "SUBSCRIPTION_PROVIDER",
              "SUBSCRIPTION_WEBHOOK_SECRET",
              "APPLE_STORE_VERIFIER_MODE",
              "GOOGLE_PLAY_VERIFIER_MODE",
              "APPLE_BUNDLE_ID",
              "APPLE_STORE_ENVIRONMENT",
              "APPLE_APP_APPLE_ID",
              "GOOGLE_PLAY_PACKAGE_NAME",
              "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON",
              "ENVIRONMENT_ALLOW_SAMPLE_FALLBACK",
              "WEATHER_API_PROVIDER",
              "WEATHER_API_KEY",
              "AQI_API_PROVIDER",
              "AQI_API_KEY",
          }
          defaults = {
              "APP_ENV": "production",
              "APPLE_BUNDLE_ID": "com.hiair.app",
              "GOOGLE_PLAY_PACKAGE_NAME": "com.hiair",
              "HIAIR_AUTH_PROVIDER": "supabase",
              "HIAIR_AUTH_EMAIL_BRIDGE_ENABLED": "true",
              "ENVIRONMENT_ALLOW_SAMPLE_FALLBACK": "false",
          }
          out = Path("/tmp/hiair-api-secrets.env")
          lines = []
          for key in sorted(allowed):
              value = os.environ.get(key, "").strip()
              if not value and key in defaults:
                  value = defaults[key]
              if value:
                  lines.append(f"{key}={value}")
          env_map = dict(line.split("=", 1) for line in lines)
          apple_mode = env_map.get("APPLE_STORE_VERIFIER_MODE", "").strip().lower()
          apple_store_env = env_map.get("APPLE_STORE_ENVIRONMENT", "").strip().lower()
          apple_app_id = env_map.get("APPLE_APP_APPLE_ID", "").strip()
          google_mode = env_map.get("GOOGLE_PLAY_VERIFIER_MODE", "").strip().lower()
          google_sa = env_map.get("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON", "").strip()
          auth_provider = env_map.get("HIAIR_AUTH_PROVIDER", "").strip().lower()
          subscription_provider = env_map.get("SUBSCRIPTION_PROVIDER", "").strip().lower()
          if apple_mode != "live":
              raise SystemExit("ERROR: production deploy requires APPLE_STORE_VERIFIER_MODE=live")
          if apple_store_env not in ("production", "prod"):
              raise SystemExit("ERROR: production deploy requires APPLE_STORE_ENVIRONMENT=production")
          if not apple_app_id.isdigit():
              raise SystemExit("ERROR: production deploy requires numeric APPLE_APP_APPLE_ID")
          if google_mode not in ("live", "disabled"):
              raise SystemExit(
                  "ERROR: production deploy requires GOOGLE_PLAY_VERIFIER_MODE=live or disabled"
              )
          if google_mode == "live" and not google_sa:
              raise SystemExit(
                  "ERROR: production deploy requires GOOGLE_PLAY_SERVICE_ACCOUNT_JSON "
                  "when GOOGLE_PLAY_VERIFIER_MODE=live"
              )
          if google_mode == "disabled":
              print(
                  "WARNING: GOOGLE_PLAY_VERIFIER_MODE=disabled — Android billing unavailable "
                  "(not STORE SANDBOX READY)"
              )
          if auth_provider and auth_provider != "supabase":
              raise SystemExit("ERROR: production deploy requires HIAIR_AUTH_PROVIDER=supabase")
          if not auth_provider:
              env_map["HIAIR_AUTH_PROVIDER"] = "supabase"
          if not subscription_provider or subscription_provider == "stub":
              raise SystemExit("ERROR: production deploy requires SUBSCRIPTION_PROVIDER != stub")
          env_map["ENVIRONMENT_ALLOW_SAMPLE_FALLBACK"] = "false"
          lines = [f"{key}={env_map[key]}" for key in sorted(env_map)]
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Wrote {len(lines)} secrets to {out} (values not logged)")
          print("Synced keys: " + ", ".join(sorted(env_map)))
          PY

      - name: Deploy API to Cloudflare Containers
        if: env.DEPLOY == '1'
        run: HIAIR_API_ENV_FILE=/tmp/hiair-api-secrets.env ./scripts/ops/deploy_hiair_api_cloudflare.sh

      - name: Smoke check production API
        if: env.DEPLOY == '1'
        run: |
          python3 scripts/release/post_deploy_api_smoke.py --require-live-ai
