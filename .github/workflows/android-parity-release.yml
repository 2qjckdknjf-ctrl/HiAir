name: Android Parity Release

on:
  push:
    branches:
      - release/android-ios-parity-2026-09-09
    paths:
      - ".github/workflows/android-parity-release.yml"
      - "mobile/android/**"
      - "scripts/release/validate_store_release_builds.sh"

permissions:
  contents: read

jobs:
  signed-play-release:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: mobile/android

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Require signing and Google Play credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Release blocked: missing required production secrets: ${missing[*]}"
            exit 1
          fi
          echo "Signing and Play credentials are configured."

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Run release tests and lint
        run: ./gradlew test lintDebug --no-daemon

      - name: Build signed Android 1.1 AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: "192"
          ANDROID_VERSION_NAME: "1.1"
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Validate production API in AAB
        working-directory: .
        run: bash scripts/release/validate_store_release_builds.sh android

      - name: Upload Android 1.1 to Google Play internal testing
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hiair
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: HiAir 1.1 (192) parity release

      - name: Preserve signed AAB evidence
        uses: actions/upload-artifact@v4
        with:
          name: hiair-android-1.1-192-signed
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
