<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <filter id="lg-refraction" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="noise">
        <animate attributeName="seed" values="7;47;7" dur="14s" repeatCount="indefinite" />
      </feTurbulence>
      <feComponentTransfer in="noise" result="map">
        <feFuncR type="gamma" amplitude="1" exponent="8" offset="0" />
        <feFuncG type="gamma" amplitude="0" exponent="1" offset="0.5" />
        <feFuncB type="gamma" amplitude="1" exponent="8" offset="0" />
      </feComponentTransfer>
      <feGaussianBlur in="map" stdDeviation="2" result="smoothMap" />
      <feDisplacementMap in="SourceGraphic" in2="smoothMap" scale="18" xChannelSelector="R" yChannelSelector="B" />
    </filter>
    <filter id="lg-refraction-soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.01" numOctaves="2" seed="3" result="noise" />
      <feComponentTransfer in="noise" result="map">
        <feFuncR type="gamma" amplitude="1" exponent="10" offset="0" />
        <feFuncG type="gamma" amplitude="0" exponent="1" offset="0.5" />
        <feFuncB type="gamma" amplitude="1" exponent="10" offset="0" />
      </feComponentTransfer>
      <feGaussianBlur in="map" stdDeviation="3" result="smoothMap" />
      <feDisplacementMap in="SourceGraphic" in2="smoothMap" scale="8" xChannelSelector="R" yChannelSelector="B" />
    </filter>
  </defs>
</svg>
