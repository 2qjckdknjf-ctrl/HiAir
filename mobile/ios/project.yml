name: HiAir
options:
  minimumXcodeGenVersion: 2.37.0
  objectVersion: 56
  bundleIdPrefix: com.hiair
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.7.0
targets:
  HiAir:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - HiAir
    entitlements:
      path: HiAir/HiAir.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 43A4KW5BKB
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hiair.app
        SWIFT_VERSION: 5.0
        CURRENT_PROJECT_VERSION: 11
        MARKETING_VERSION: 0.1.0
        INFOPLIST_KEY_CFBundleDisplayName: HiAir
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleURLTypes:
          - CFBundleURLName: com.hiair.app.auth
            CFBundleURLSchemes:
              - hiair
        # Export compliance: HTTPS/TLS only (exempt); skips ASC encryption questionnaire.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: >-
          HiAir uses your location to estimate heat and air-quality risk for your area and personalize local guidance.
        INFOPLIST_KEY_NSHealthShareUsageDescription: >-
          HiAir reads steps and heart rate to estimate personal activity load during heat and poor air quality. HiAir provides wellness guidance, not medical diagnosis.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: >-
          HiAir connects to Apple Health to read steps and heart rate for personal activity insights. HiAir does not write health data to Apple Health.
        INFOPLIST_KEY_LSApplicationQueriesSchemes:
          - x-apple-health
      configs:
        Debug:
          CODE_SIGNING_ALLOWED[sdk=iphoneos*]: NO
          CODE_SIGNING_REQUIRED[sdk=iphoneos*]: NO
          INFOPLIST_KEY_API_BASE_URL: http://127.0.0.1:8000
          INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
          INFOPLIST_KEY_SUPABASE_URL: https://qhxesaemlhzwbunpqjoo.supabase.co
          INFOPLIST_KEY_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoeGVzYWVtbGh6d2J1bnBxam9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3Nzk5MzgsImV4cCI6MjA5NTM1NTkzOH0.B9TOtpcqQZS81Sx5vlRyN3nhxZTWQWzaqZ-F8RFbCZw
          INFOPLIST_KEY_HIAIR_AUTH_REDIRECT_URI: hiair://auth/callback
        Release:
          INFOPLIST_KEY_API_BASE_URL: https://api.hiair.io
          INFOPLIST_KEY_SUPABASE_URL: https://qhxesaemlhzwbunpqjoo.supabase.co
          INFOPLIST_KEY_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoeGVzYWVtbGh6d2J1bnBxam9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3Nzk5MzgsImV4cCI6MjA5NTM1NTkzOH0.B9TOtpcqQZS81Sx5vlRyN3nhxZTWQWzaqZ-F8RFbCZw
          INFOPLIST_KEY_HIAIR_AUTH_REDIRECT_URI: hiair://auth/callback
    dependencies:
      - package: Supabase
  HiAirTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - HiAirTests
    dependencies:
      - target: HiAir
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiair.app.tests
        SWIFT_VERSION: 5.0
schemes:
  HiAir:
    build:
      targets:
        HiAir: all
    run:
      config: Debug
      storeKitConfiguration: HiAir/Configuration/HiAirPremium.storekit
    test:
      config: Debug
      targets:
        - HiAirTests
